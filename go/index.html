<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Flow</title>
<meta name="description" content="Write it. Flow handles the rest for you.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Get Flow">
<meta property="og:description" content="Write it. Flow handles the rest for you.">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #8a8f98;
    --line: #2a2d33;
    --accent: #f27a21;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 360px; text-align: center; }
  .mark {
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 0;
  }
  .mark span { color: var(--accent); }
  h1 { font-size: 22px; font-weight: 700; margin: 8px 0 6px; }
  p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 32px; }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--fg);
  }
  .live { background: var(--fg); color: #000; }
  .live:hover { background: #e8e8e8; }
  .soon {
    border-color: var(--line);
    color: var(--muted);
    cursor: default;
  }
  .soon small { display: block; font-size: 13px; font-weight: 400; margin-top: 2px; }
  .support { margin-top: 24px; }
  .support small { display: block; font-size: 13px; font-weight: 400; margin-top: 2px; color: #555; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">F<span>.</span></div>
  <h1>Flow</h1>
  <p>Write it. Flow handles the rest for you.</p>

  <a class="btn live" href="https://play.google.com/store/apps/details?id=com.flowdaily.app&pcampaignid=web_share">Get it on Google Play</a>

  <div class="btn soon" role="link" aria-disabled="true">
    App Store
    <small>Coming soon</small>
  </div>

  <a class="btn live support" href="https://gofund.me/f0a827671" target="_blank" rel="noopener">
    Support Flow
    <small>Donate on GoFundMe</small>
  </a>
</main>
</body>
</html>
